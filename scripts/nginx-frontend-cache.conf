# Include inside the Accounts server block, after the dot-file deny location.
# This root-hosted counterpart of frontend/.htaccess does not handle PHP.
location ~* ^/frontend/.*\.html?$ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT" always;
}
location ~* ^/frontend/.*\.(?:css|js|json|map|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
}
location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
}
