<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/app-180.png">
    <meta name="theme-color" content="#312e81">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Accounts">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/web-app.css">
    <script src="js/phone_entry.js"></script>
    <script src="js/web_app.js"></script>
    <title>Excluded Transactions</title>
    <link rel="stylesheet" href="vendor/tailwind/tailwind.min.css">

    <link rel="stylesheet" href="operational_ui.css?v=20261005-full-width">
    <link rel="stylesheet" href="vendor/tabulator/6.5.0/tabulator_simple.min.css">
</head>
<body class="ops-body">
    <div class="flex min-h-screen">
        <nav id="menu" class="hidden md:flex md:flex-col w-64 flex-shrink-0 bg-transparent p-6 overflow-y-auto"></nav>
        <main class="ops-main flex-1 min-w-0 overflow-x-auto">
<p class="mb-4">Transactions tagged with <strong>IGNORE</strong> are hidden from dashboards and reports. Use this page to review and restore them.</p>
            <section class="cards cards-tight">
                <div id="ignored-table"></div>
            </section>
        </main>
    </div>
    <script src="js/page_header.js"></script>
    <script>
const pageMain = document.querySelector('main.ops-main');
window.renderPageHeader(pageMain, {
    title: 'Excluded Transactions',
    breadcrumb: 'Transactions',
    subtitle: 'Review transactions marked as ignored so they are excluded from analysis.'
});
</script>
    <script src="js/menu.js"></script>
    <script src="vendor/tabulator/6.5.0/tabulator.min.js"></script>
    <script src="js/tabulator-tailwind.js?v=20260815-pill-key"></script>
    <script>
    let table;
    async function loadIgnored(){
        const res = await fetch('../php_backend/public/ignored_transactions.php');
        const data = await res.json();
        if (table){
            table.setData(data);
        } else {
            table = tailwindTabulator('#ignored-table', {
                data: data,
                layout: 'fitDataStretch',
                columns: [
                    {title: 'Date', field: 'date'},
                    {title: 'Account', field: 'account_name'},
                    {title: 'Description', field: 'description'},
                    {title: 'Amount', field: 'amount', formatter: 'money', formatterParams: {symbol: '£', precision: 2}, hozAlign: 'right'},
                    {title: 'Action', formatter: () => '<button class="bg-indigo-600 text-white px-2 py-1 rounded">Unignore</button>', width: 110, hozAlign: 'center', cellClick: async (e, cell) => {
                        const id = cell.getRow().getData().id;
                        await fetch('../php_backend/public/unignore_transaction.php', {
                            method: 'POST',
                            headers: {'Content-Type':'application/json'},
                            body: JSON.stringify({transaction_id: id})
                        });
                        showMessage('Transaction restored');
                        loadIgnored();
                    }}
                ]
            });
        }
    }
    loadIgnored();
    </script>
    <script src="js/overlay.js"></script>
</body>
</html>
