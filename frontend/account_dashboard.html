<!DOCTYPE html>
<!-- Dashboard showing account summaries -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Account Dashboard</title>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {};
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="operational_ui.css">
    <link rel="stylesheet" href="account_dashboard.css">

</head>
<body class="ops-body dashboard-page account-dashboard-page">
    <div class="flex min-h-screen">
        <nav id="menu" class="hidden md:flex md:flex-col w-64 flex-shrink-0 bg-transparent p-6 overflow-y-auto"></nav>
        <main class="ops-main flex-1 min-w-0 overflow-x-auto">
            <section class="account-dashboard" data-no-card>
                <div id="account-summary" class="account-summary" aria-label="Account summary">
                    <div class="account-summary-card is-loading" aria-hidden="true"></div>
                    <div class="account-summary-card is-loading" aria-hidden="true"></div>
                    <div class="account-summary-card is-loading" aria-hidden="true"></div>
                    <div class="account-summary-card is-loading" aria-hidden="true"></div>
                </div>

                <section class="account-ledger" aria-labelledby="account-ledger-title">
                    <header class="account-ledger-header">
                        <div>
                            <p class="account-kicker">Account portfolio</p>
                            <div class="account-heading-row">
                                <h2 id="account-ledger-title">Your accounts</h2>
                                <span id="account-result-count" class="account-count" aria-live="polite">Loading</span>
                            </div>
                            <p>Balances, activity and identifiers in one calm, scannable view.</p>
                        </div>
                        <div class="account-table-tools">
                            <label class="account-search" for="account-search">
                                <i class="fas fa-search" aria-hidden="true"></i>
                                <span class="sr-only">Search accounts</span>
                                <input id="account-search" type="search" placeholder="Find an account" autocomplete="off">
                            </label>
                            <label class="account-sort" for="account-sort">
                                <span>Sort</span>
                                <select id="account-sort">
                                    <option value="name-asc">Name A–Z</option>
                                    <option value="name-desc">Name Z–A</option>
                                    <option value="balance-desc">Highest balance</option>
                                    <option value="balance-asc">Lowest balance</option>
                                    <option value="transactions-desc">Most activity</option>
                                    <option value="transactions-asc">Least activity</option>
                                    <option value="last_transaction-desc">Most recent</option>
                                    <option value="last_transaction-asc">Least recent</option>
                                </select>
                            </label>
                        </div>
                    </header>

                    <div class="account-filter-row" aria-label="Filter account type">
                        <button type="button" class="account-filter is-active" data-account-filter="all" aria-pressed="true">All accounts</button>
                        <button type="button" class="account-filter" data-account-filter="bank" aria-pressed="false">Bank accounts</button>
                        <button type="button" class="account-filter" data-account-filter="credit" aria-pressed="false">Credit cards</button>
                    </div>

                    <div id="account-table-status" class="account-table-status" role="status" aria-live="polite">
                        <span class="account-spinner" aria-hidden="true"></span>
                        Loading your accounts
                    </div>
                    <div id="accounts-table" class="account-table-region" hidden></div>
                </section>

                <section class="account-chart-panel" aria-labelledby="account-chart-title">
                    <header>
                        <div>
                            <p class="account-kicker">Balance composition</p>
                            <h2 id="account-chart-title">How your accounts compare</h2>
                        </div>
                        <p>Positive and negative balances are separated so credit exposure stays visible.</p>
                    </header>
                    <div id="accounts-chart" class="account-chart" data-chart-desc="Bar chart comparing the balance of each account."></div>
                </section>
            </section>
        </main>
    </div>
    <script src="js/page_header.js"></script>
    <script>
const pageMain = document.querySelector('main.ops-main');
window.renderPageHeader(pageMain, {
    title: 'Account Dashboard',
    breadcrumb: 'Dashboards / Accounts',
    subtitle: 'Scan every balance, identifier and activity signal, then open an account when something needs attention.'
});
</script>
    <script src="js/menu.js"></script>
    <script src="js/input_help.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="js/color_map.js"></script>
    <script src="js/account_dashboard.js"></script>
    <script src="js/overlay.js"></script>
</body>
</html>
